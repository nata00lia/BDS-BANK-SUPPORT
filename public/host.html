<!DOCTYPE html>
<html>
<head><title>BDS.BANK SUPPORT</title></head>
<body style="font-family:Arial;padding:20px;max-width:600px;margin:auto">
<h1 style="color:#0a3d62;text-align:center">BDS.BANK SUPPORT</h1>
<p style="text-align:center">Private Secure Chat Generator</p>
<button id="create" style="width:100%;padding:15px;background:#0a3d62;color:white;border:none;cursor:pointer">Generate Private Chat Link</button>
<p id="link" style="background:#eee;padding:10px;word-break:break-all;margin-top:15px"></p>
<div id="box" style="border:1px solid #ccc;height:300px;overflow:auto;margin:10px 0;padding:10px"></div>
<input id="input" style="width:70%;padding:10px" placeholder="Type reply...">
<button id="send" style="padding:10px">Send</button><br><br>
<button id="end" style="width:100%;background:red;color:white;padding:12px;border:none">END CHAT FOREVER</button>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io();let roomId=null;
create.onclick=()=>socket.emit('create-room');
socket.on('room-created',d=>{roomId=d.roomId;link.innerText="COPY THIS LINK: "+d.link;socket.emit('join-room',{roomId,isHost:true})});
send.onclick=()=>{if(!input.value)return;socket.emit('send-message',{roomId,message:"SUPPORT: "+input.value});input.value='';};
socket.on('receive-message',m=>{box.innerHTML+=`<p>${m}</p>`;box.scrollTop=box.scrollHeight});
end.onclick=()=>{if(confirm('End this chat forever? You will not get messages again.'))socket.emit('end-chat',roomId)};
socket.on('chat-ended',()=>{box.innerHTML+="<p><i>You closed this chat.</i></p>"});
</script>
</body>
</html>
