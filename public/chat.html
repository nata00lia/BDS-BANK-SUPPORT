<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>BDS BANK SUPPORT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto; background:#e5ddd5; height:100dvh; display:flex; flex-direction:column}
.top{background:#075e54; color:white; padding:12px 15px; display:flex; align-items:center; justify-content:space-between; position:fixed; top:0; left:0; right:0; z-index:20; height:56px}
.top h3{font-size:15px}
#linkBar{background:#fff3cd; font-size:11px; padding:8px; text-align:center; position:fixed; top:56px; left:0; right:0; z-index:10; word-break:break-all; display:none}
#chat{margin-top:56px; flex:1; overflow-y:auto; padding:70px 10px 75px 10px; background-image:url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');}
.bubble{max-width:78%; padding:8px 10px 5px 10px; border-radius:7.5px; margin:4px 0; font-size:15.2px; line-height:19px; position:relative; box-shadow:0 1px 0.5px rgba(0,0,0,0.13)}
.me{background:#dcf8c6; margin-left:auto; border-top-right-radius:0}
.other{background:white; margin-right:auto; border-top-left-radius:0}
.small{font-size:11px; color:#667781; font-weight:600; margin-bottom:2px}
.time{font-size:10px; color:#667781; float:right; margin-top:4px; margin-left:6px}
#typing{position:fixed; bottom:68px; left:12px; font-size:12.5px; color:#075e54; font-style:italic; background:rgba(255,255,255,0.9); padding:3px 8px; border-radius:10px; display:none}
.bottom{position:fixed; bottom:0; left:0; right:0; background:#f0f0f0; padding:6px 8px; display:flex; align-items:center; gap:6px; z-index:20}
.bottom input{flex:1; border:none; border-radius:21px; padding:12px 16px; font-size:16px; outline:none}
.bottom button{background:#075e54; color:white; border:none; width:46px; height:46px; border-radius:50%; font-size:20px}
#endBtn{background:#d32f2f; color:white; border:none; padding:6px 10px; border-radius:4px; font-size:10px; font-weight:bold}
</style>
</head>
<body>
<div class="top">
<div><h3>BDS.BANK SUPPORT</h3><div id="who" style="font-size:11px; opacity:0.9"></div></div>
<button id="endBtn">END CHAT</button>
</div>
<div id="linkBar"></div>
<div id="chat"></div>
<div id="typing"></div>
<div class="bottom">
<input id="input" placeholder="Type a message" autocomplete="off"/>
<button id="send">➤</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const roomId = location.pathname.split('/').pop();
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const typingDiv = document.getElementById('typing');
let isHost = false;

socket.emit('join-room', roomId, false);

socket.on('room-created', (id, link)=>{
  document.getElementById('linkBar').style.display='block';
  document.getElementById('linkBar').innerText = 'COPY THIS LINK: ' + link;
  isHost = true;
  document.getElementById('who').innerText = 'You (Support)';
});

socket.on('joined', (host)=>{
  isHost = host;
  document.getElementById('who').innerText = host? 'You (Support)' : 'You (Client)';
});

function addMsg(text, senderIsMe){
  const div = document.createElement('div');
  div.className = 'bubble ' + (senderIsMe? 'me' : 'other');
  const name = senderIsMe? 'You' : (isHost? 'Client' : 'Support');
  const time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  div.innerHTML = `<div class="small">${name}</div>${text}<span class="time">${time}</span>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

document.getElementById('send').onclick = send;
input.addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });

function send(){
  const t = input.value.trim();
  if(!t) return;
  addMsg(t, true);
  socket.emit('send-msg', roomId, t, isHost? 'SUPPORT' : 'CLIENT');
  input.value='';
}

socket.on('receive-msg', (msg, sender)=>{
  const senderIsMe = (sender==='SUPPORT' && isHost) || (sender==='CLIENT' &&!isHost);
  if(senderIsMe) return;
  addMsg(msg, false);
});

let typingTimer;
input.addEventListener('input', ()=>{
  socket.emit('typing', roomId, isHost? 'SUPPORT' : 'CLIENT');
});
socket.on('show-typing', (sender)=>{
  const senderIsMe = (sender==='SUPPORT' && isHost) || (sender==='CLIENT' &&!isHost);
  if(senderIsMe) return;
  const label = isHost? 'Client' : 'Support';
  typingDiv.innerText = `${label} is typing...`;
  typingDiv.style.display='block';
  clearTimeout(typingTimer);
  typingTimer = setTimeout(()=> typingDiv.style.display='none', 2000);
});

document.getElementById('endBtn').onclick = ()=>{
  if(confirm('End chat forever?')) socket.emit('close-room', roomId);
};
socket.on('room-closed', ()=>{ alert('Chat ended'); location.href='/'; });
socket.on('error-msg', m=> alert(m));
</script>
</body>
</html>
